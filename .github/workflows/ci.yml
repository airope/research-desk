name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: srr
          POSTGRES_PASSWORD: srr-local-only
          POSTGRES_DB: srr
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U srr" --health-interval 5s
          --health-timeout 5s --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
        # Disposable runner service only; never reuse this security setting in deployment.
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl --fail --silent http://localhost:9200/_cluster/health"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGPORT: '5432'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.2'
          python-version: '3.12.13'
      - name: Validate local Compose definitions
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.search.yaml --profile search config --quiet
        env:
          RESEARCH_ELASTIC_PASSWORD: ci-only-unused-compose-password
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - name: Validate production configuration
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          APP_ENV: production
          DEBUG: '0'
          SECRET_KEY: ci-only-config-check-not-a-production-secret-0123456789abcdef
          PGPASSWORD: ci-only-config-check-password
          ALLOWED_HOSTS: research.example.org
      - name: Reject common credential literals in versioned files
        shell: python
        run: |
          import pathlib, re, subprocess, sys
          patterns = [
              rb"sk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{32,}",
              rb"AKIA[0-9A-Z]{16}",
              rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
          ]
          findings = []
          for name in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not name:
                  continue
              path = pathlib.Path(name.decode())
              if path.is_file() and not path.is_symlink():
                  if any(re.search(pattern, path.read_bytes()) for pattern in patterns):
                      findings.append(str(path))
          if findings:
              print("Potential credentials found; inspect these files (values suppressed):")
              print("\n".join(findings))
              sys.exit(1)
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate --noinput
      - run: uv run pytest -q
      - name: Elasticsearch wire-protocol integration (no LLM credentials)
        run: uv run pytest tests/test_research_elasticsearch_integration.py -q
        env:
          RESEARCH_TEST_ELASTICSEARCH_URL: http://127.0.0.1:9200
      - run: uv run python manage.py spectacular --file /tmp/schema.yaml --validate --fail-on-warn
      - run: uv run python manage.py demo
      - run: uv run python manage.py benchmark --output /tmp/benchmark.json
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and start local demonstration
        run: docker compose up --build -d
      - name: Verify HTTP readiness and load offline fixture
        run: |
          curl --fail --silent --show-error --max-time 5 --retry 30 --retry-all-errors --retry-max-time 90 --retry-delay 2 http://127.0.0.1:8000/ > /tmp/research-desk-home.html
          docker compose exec -T web python manage.py check
          docker compose exec -T web python manage.py demo
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable demonstration
        if: always()
        run: docker compose down --volumes
