[project]
name = "scholarly-record-reconciliation"
version = "0.1.0"
description = "Traceable, reversible reconciliation of scholarly metadata"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "jsonschema>=4.26,<5",
  "rapidfuzz>=3.14,<4",
  "gunicorn>=23,<26",
  "pypdf>=6.0,<7",
  "elasticsearch>=8.19,<9",
]
[project.optional-dependencies]
embeddings = ["onnxruntime>=1.20,<2", "huggingface-hub>=0.30,<2", "tokenizers>=0.21,<1", "numpy>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1", "coverage>=7,<8"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "srr.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
